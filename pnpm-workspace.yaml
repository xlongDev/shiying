allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  prisma: true
  sharp: true
  unrs-resolver: true
  es5-ext: true
minimumReleaseAgeExclude:
  - "@floating-ui/core@1.8.0"
  - "@floating-ui/dom@1.8.0"
  - "@floating-ui/react-dom@2.1.9"
  - "@floating-ui/react@0.27.20"
  - "@floating-ui/utils@0.2.12"
  - baseline-browser-mapping@2.10.43
  - browserslist@4.28.6
  - caniuse-lite@1.0.30001805
  - grammex@3.1.13
  - postcss@8.5.17
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@prisma/client"
  - "@prisma/engines"
  - "@swc/core"
  - es5-ext
  - prisma
  - sharp
  - unrs-resolver
