<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="拾影">
  <title>拾影</title>
  <defs>
    <linearGradient id="sy-tile" x1="2" y1="1" x2="30" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff5aab"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="sy-glow" cx="0.32" cy="0.22" r="0.9" gradientUnits="objectBoundingBox">
